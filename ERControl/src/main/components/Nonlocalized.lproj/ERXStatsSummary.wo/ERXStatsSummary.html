<wo:if condition="$hasStats">
<table class="ERXStatsSummary" border="0" cellspacing="0" cellpadding="2">
    <tr>
        <th scope="col">Type</th>
        <th scope="col">Duration</th>
    </tr>
    <wo:repetition item="$currentType" list="$statsTypes">
    <tr>
        <td><wo:str value="$currentType" /></td>
        <td align="right"><wo:str value="$durationForStatsType" /> ms</td>
    </tr>
    </wo:repetition>

</table>
</wo:if>
