<style>
	.routes-table > tbody > tr > td { padding-top: 0.85rem; padding-bottom: 0.85rem; }
	.routes-table > tbody > tr > td:first-child { padding-left: 1.25rem; }
	.routes-table code.route-pattern { font-size: 0.95rem; padding: 0.15rem 0.4rem; }
	.routes-table .badge { margin: 0.1rem 0.25rem 0.1rem 0; }
	.route-expandable { cursor: pointer; }
	.route-details { display: none; }
	.route-open .route-details { display: table-row; }
	.route-open > tr:first-child > td { border-bottom-width: 0; }
	.route-open .route-caret { display: inline-block; transform: rotate(90deg); }
	.route-details > td { background: var(--tblr-bg-surface-secondary, #f6f8fb); padding: 1.25rem 1.5rem !important; }
	.route-details dt { font-weight: 600; padding-bottom: 0.6rem; }
	.route-details dd { padding-bottom: 0.6rem; }
</style>
<div class="row row-cards">
	<div class="col-12">
		<div class="card">
			<div class="card-header"><h3 class="card-title">How the application routes</h3><div class="card-subtitle ms-3"><wo:str value="$routeCount" /> routes in <wo:str value="$tableCount" /> tables</div></div>
			<div class="table-responsive">
				<table class="table table-vcenter card-table">
					<tbody>
						<wo:repetition list="$settings" item="$currentDetail">
							<tr>
								<td class="text-nowrap w-1"><strong><wo:str value="$currentDetail.label" /></strong></td>
								<td>
									<wo:str value="$currentDetail.text" />
									<wo:if condition="$currentDetail.code"><div><code><wo:str value="$currentDetail.code" /></code></div></wo:if>
								</td>
								<td class="text-nowrap text-end w-1"><wo:if condition="$currentDetail.guide"><wo:link href="$currentDetail.guide" target="_blank" rel="noopener">Guide</wo:link></wo:if></td>
							</tr>
						</wo:repetition>
					</tbody>
				</table>
			</div>
		</div>
	</div>
	<wo:repetition list="$tables" item="$currentTable">
		<div class="col-12">
			<div class="card">
				<div class="card-header"><h3 class="card-title"><code><wo:str value="$currentTable.name" /></code></h3><div class="card-subtitle ms-3"><wo:str value="$currentTable.about" /></div></div>
				<div class="table-responsive">
					<table class="table table-vcenter card-table table-hover routes-table">
						<thead>
							<tr><th class="w-1">#</th><th>Pattern</th><th>Answers with</th><th>Conditions</th><th>Constant</th><th>Kind</th><th class="w-1"></th></tr>
						</thead>
						<wo:repetition list="$currentTable.rows" item="$currentRow" index="$currentIndex">
							<tbody>
								<wo:genericContainer elementName="tr" class="$currentRow.rowClass" onclick="this.parentNode.classList.toggle('route-open')">
									<td class="text-secondary"><wo:str value="$currentPosition" /></td>
									<td><code class="route-pattern"><wo:str value="$currentRow.pattern" /></code></td>
									<td class="text-nowrap"><wo:str value="$currentRow.route.answer" /></td>
									<td><wo:repetition list="$currentRow.conditions" item="$currentCondition"><span class="badge bg-azure-lt"><wo:str value="$currentCondition" /></span></wo:repetition></td>
									<td class="font-monospace small text-secondary text-nowrap"><wo:str value="$currentRow.route.constant" /></td>
									<td class="text-nowrap"><span class="badge bg-secondary-lt"><wo:str value="$currentRow.kind" /></span></td>
									<td class="text-secondary"><wo:if condition="$currentRow.hasDetails"><span class="route-caret">▸</span></wo:if></td>
								</wo:genericContainer>
								<wo:if condition="$currentRow.hasDetails"><tr class="route-details">
									<td colspan="7">
										<dl class="row mb-0">
											<wo:repetition list="$currentRow.details" item="$currentDetail">
												<dt class="col-sm-2"><wo:str value="$currentDetail.label" /></dt>
												<dd class="col-sm-10">
													<wo:str value="$currentDetail.text" />
													<wo:if condition="$currentDetail.code"><div class="mt-1"><code><wo:str value="$currentDetail.code" /></code></div></wo:if>
													<wo:if condition="$currentDetail.guide"> <wo:link href="$currentDetail.guide" target="_blank" rel="noopener" class="small">Guide</wo:link></wo:if>
												</dd>
											</wo:repetition>
										</dl>
									</td>
								</tr></wo:if>
							</tbody>
						</wo:repetition>
					</table>
				</div>
			</div>
		</div>
	</wo:repetition>
</div>
