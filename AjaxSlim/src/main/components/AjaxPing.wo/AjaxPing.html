<wo:AjaxSelfUpdatingContainer id="$id" frequency="$frequencyInSeconds" stopped="$stopped" elementName="span" style="display:none">
	<wo:if condition="$hasTargetContainerID">
		<wo:AjaxPingUpdate cacheKey="$cacheKey" targetContainerID="$targetContainerID" onBeforeUpdate="$onBeforeUpdate" />
	</wo:if>
	<wo:WOComponentContent />
</wo:AjaxSelfUpdatingContainer>
