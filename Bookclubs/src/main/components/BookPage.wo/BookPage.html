<wo:Frame club="$club" title="$book.title">
	<h1><wo:str value="$book.title" /></h1>
	<p><wo:str value="$book.author" />, <wo:str value="$book.year" valueWhenEmpty="year unknown" /></p>
	<wo:form href="$deleteURL" method="post">
		<button type="submit">Remove from the club's list</button>
	</wo:form>
</wo:Frame>
