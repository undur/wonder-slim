<wo:Frame club="$club" title="$book.title">
	<h1><wo:str value="$book.title" /></h1>
	<p class="lead"><wo:str value="$book.author" />, <wo:str value="$book.year" valueWhenEmpty="year unknown" /></p>
	<wo:routeForm route="$routes.deleteBook" :book="$book">
		<button type="submit">Remove from the club's list</button>
	</wo:routeForm>
</wo:Frame>
