<wo:container elementName="div" id="$tabID" class="accordionTab">
	<wo:container elementName="div" id="$headerID" class="accordionTabTitleBar">
		<wo:str value="$^title" />
 	</wo:container>
 	<wo:container elementName="div" id="$contentID" class="accordionTabContentBox">
 		<div class = "accordionTabContent">
	 		<wo:content />
	 	</div>
 	</wo:container>
</wo:container>
