<wo:AjaxUpdateContainer id="$id">
	<wo:if condition="$^targetContainerID"><wo:AjaxPingUpdate cacheKey="$^cacheKey" targetContainerID="$^targetContainerID" onBeforeUpdate="$^onBeforeUpdate" /></wo:if><wo:content />
	<wo:if condition="$^stop" negate="$true"><script type="text/javascript">setTimeout("<wo:str value="$id" />Update()", <wo:str value="$frequency" />)</script></wo:if>
</wo:AjaxUpdateContainer>
