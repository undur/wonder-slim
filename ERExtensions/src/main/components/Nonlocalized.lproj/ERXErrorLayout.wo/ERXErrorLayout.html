<!doctype html>
<html>
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title><wo:str value="$title" /></title>
		<style>
			:root {
				--bg: #fbfbfc;
				--panel: #ffffff;
				--border: #e3e3e8;
				--text: #2b2b30;
				--muted: #9a9aa3;
				--accent: #c0392b;
			}

			* { box-sizing: border-box; }

			body {
				font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
				font-size: 15px;
				line-height: 1.5;
				color: var(--text);
				background: var(--bg);
				margin: 0;
				min-height: 100vh;
				display: flex;
				align-items: center;
				justify-content: center;
				padding: 24px;
			}

			.card {
				background: var(--panel);
				border: 1px solid var(--border);
				border-radius: 10px;
				padding: 32px 36px 28px;
				max-width: 540px;
				width: 100%;
				box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
			}

			.icon {
				width: 36px;
				height: 36px;
				color: var(--accent);
				display: block;
				margin-bottom: 16px;
			}

			h1 {
				font-size: 20px;
				font-weight: 600;
				margin: 0 0 12px;
			}

			p { margin: 0 0 12px; }

			.muted {
				color: var(--muted);
				font-size: 13px;
			}

			.actions { margin-top: 22px; }

			.button {
				display: inline-block;
				padding: 9px 18px;
				border-radius: 6px;
				background: var(--text);
				color: #ffffff;
				text-decoration: none;
				font-weight: 500;
			}

			.button:hover { background: #000000; }

			.application {
				margin-top: 26px;
				padding-top: 14px;
				border-top: 1px solid var(--border);
				color: var(--muted);
				font-size: 12px;
			}
		</style>
	</head>
	<body>
		<main class="card">
			<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
				<circle cx="12" cy="12" r="9.25" />
				<line x1="12" y1="7.5" x2="12" y2="13" />
				<circle cx="12" cy="16.5" r="0.6" fill="currentColor" />
			</svg>
			<h1><wo:str value="$heading" /></h1>
			<wo:content />
			<div class="application"><wo:str value="$application.name" /></div>
		</main>
	</body>
</html>
