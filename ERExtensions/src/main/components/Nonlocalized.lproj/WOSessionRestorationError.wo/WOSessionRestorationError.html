<wo:ERXErrorLayout title="Session expired" heading="Your session has expired">
	<p>You were inactive for a while, so the application closed your session. Nothing is wrong on your side - start again and carry on from there.</p>
	<p class="muted">Sessions end after <wo:str value="$sessionTimeoutMinutes" /> minutes without activity.</p>
	<p class="actions"><wo:link directActionName="default" class="button">Return to <wo:str value="$application.name" /></wo:link></p>
</wo:ERXErrorLayout>
