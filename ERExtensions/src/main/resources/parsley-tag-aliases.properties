# Parsley tag aliases contributed by ERExtensions.
#
# Each entry is  alias = target  and is registered with Parsley's tag registry
# (parsley.ParsleyTagRegistry), which resolves names recursively to a fixed point.
# Because resolution is recursive, these "element replacements" compose with Parsley's
# built-in shortcuts: a template tag "str" resolves  str -> WOString -> ERXWOString.
#
# This is the declarative equivalent of the runtime swaps ERXPatcher.installPatches()
# performs via replaceClass(...): the editor/tooling can read these statically, and the
# parser applies them with no runtime class introspection. Once this is verified, the
# corresponding replaceClass(...) calls in ERXPatcher.installPatches() are removed.
#
# Target form:
#   - a simple name (e.g. ERXWOString) is resolved as an element name like any other.
#   - a target containing '.' or '$' is a fully-qualified class name.

# --- Our own elements in place of WO's (er.extensions.components.*) ---
WOConditional = ERXWOConditional
WOForm = ERXWOForm
WORepetition = ERXWORepetition
WOString = ERXWOString
WOSwitchComponent = ERXWOSwitchComponent
WOTextField = ERXWOTextField

# --- Shortcuts for elements of our own (no WO counterpart) ---
# <wo:else> -> ERXElse, the else branch of the preceding conditional (every conditional is an
# ERXWOConditional here, see above, so it tracks the state ERXElse reads).
else = ERXElse

# --- Clean-room elements (not WO replacements; new tag names) ---
# <wo:svg> -> a from-scratch <img> element (er.extensions.components.ERXWOImage). Intended to
# become the framework's single image element (and eventually ng-objects'), replacing WOImage.
svg = ERXWOImage

# --- Patch elements, which extend the WO element they replace (er.extensions.components.patches.*) ---
WOHyperlink = ERXWOHyperlink
WOActiveImage = ERXWOActiveImage
WOBrowser = ERXWOBrowser
WOCheckBoxList = ERXWOCheckBoxList
WOHiddenField = ERXWOHiddenField
WOPasswordField = ERXWOPasswordField
WOPopUpButton = ERXWOPopUpButton
WOSubmitButton = ERXWOSubmitButton
WOText = ERXWOText
