# Parsley tag aliases contributed by ERExtensions.
#
# Each entry is  alias = target  and is registered with Parsley's tag registry
# (parsley.ParsleyTagRegistry), which resolves names recursively to a fixed point.
# Because resolution is recursive, these "element replacements" compose with Parsley's
# built-in shortcuts: a template tag "str" resolves  str -> WOString -> ERXWOString.
#
# This is the declarative equivalent of the runtime swaps ERXPatcher.installPatches()
# performs via replaceClass(...): the editor/tooling can read these statically, and the
# parser applies them with no runtime class introspection. Once this is verified, the
# corresponding replaceClass(...) calls in ERXPatcher.installPatches() are removed.
#
# Target form:
#   - a simple name (e.g. ERXWOString) is resolved as an element name like any other.
#   - a target containing '.' or '$' is a fully-qualified class name, used for the inner
#     patch classes (ERXPatcher.DynamicElementsPatches.*) which have no element name of
#     their own — they exist only to be bound to the original element's name.

# --- Top-level replacement elements (er.extensions.components.*) ---
WOForm = ERXWOForm
WOHyperlink = ERXWOHyperlink
WORepetition = ERXWORepetition
WOString = ERXWOString
WOSwitchComponent = ERXWOSwitchComponent
WOTextField = ERXWOTextField

# --- Inner patch classes (er.extensions.foundation.ERXPatcher$DynamicElementsPatches$*) ---
WOActiveImage = er.extensions.foundation.ERXDynamicElementsPatches$ActiveImage
WOBrowser = er.extensions.foundation.ERXDynamicElementsPatches$Browser
WOCheckBoxList = er.extensions.foundation.ERXDynamicElementsPatches$CheckBoxList
WOHiddenField = er.extensions.foundation.ERXDynamicElementsPatches$HiddenField
WOPasswordField = er.extensions.foundation.ERXDynamicElementsPatches$PasswordField
WOPopUpButton = er.extensions.foundation.ERXDynamicElementsPatches$PopUpButton
WOSubmitButton = er.extensions.foundation.ERXDynamicElementsPatches$SubmitButton
WOText = er.extensions.foundation.ERXDynamicElementsPatches$Text
